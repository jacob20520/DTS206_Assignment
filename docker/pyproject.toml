[build-system]
requires = [
    "setuptools>=75",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "medicore-a4-app"
version = "1.0.0"
description = "Secure containerised MediCore demonstration service for DTS206."
requires-python = ">=3.11,<3.12"

dependencies = [
    "Flask==3.1.3",
    "gunicorn==26.0.0"
]


[tool.setuptools.packages.find]
where = ["src"]